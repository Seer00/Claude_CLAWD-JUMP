<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Jump</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #14130F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script>
/* ============================== CONFIG ============================== */
const W = 640, H = 360, TILE = 16, CELL = 3;

/* Asymmetric gravity: rising, hanging near the apex, and falling each get their own
   value. One gravity forces rise and fall to mirror each other, which reads as
   floaty on the way down. Splitting them buys "floats up, drops hard" directly. */
const GRAVITY_RISE = 1650;    /* while vy < -APEX_VY   */
const GRAVITY_APEX = 800;     /* while |vy| < APEX_VY  */
const GRAVITY_FALL = 3300;    /* while vy >  APEX_VY   */
const APEX_VY = 100;          /* half-width of the hang band, px/s */
const MAX_FALL = 1000;
/* MAX_RUN is set from the jump, not chosen freely: horizontal reach = airtime x
   MAX_RUN, and every gap, landing pad and spike run in the level was sized against
   ~84px of reach. The retuned jump lengthened airtime 0.583s -> 0.667s, which alone
   pushed reach to 93px and started landing full-power jumps on top of spikes. 126
   restores 84px so the level geometry stays valid while the jump feel changes. */
const ACCEL = 900, FRICTION = 1400, MAX_RUN = 126;
const JUMP_VY = -504, JUMP_CUT = 0.4;
const COYOTE = 0.10, BUFFER = 0.10;
const STEP = 1 / 60, MAX_STEPS = 5;

const CLAWD = [
  ".AAAAAAAAAA.",
  ".AAAAAAAAAA.",
  ".AABAAAABAA.",
  "AAAAAAAAAAAA",
  "AAAAAAAAAAAA",
  ".AAAAAAAAAA.",
  "..A.A..A.A..",
  "..A.A..A.A.."
];
const PALETTE = { A: "#D97757", B: "#14130F" };

const SPRITE_W = 12 * CELL, SPRITE_H = 8 * CELL;   /* 36 x 24 */
const BOX_W = 30, BOX_H = 24;
const SPRITE_OFF = (SPRITE_W - BOX_W) / 2;          /* 3 */

const C_SKY_TOP = "#F0EEE6", C_SKY_BOT = "#E3DDD0", C_HILL = "#CFC7B5";
const C_TERRAIN = "#3B3630", C_TERRAIN_CAP = "#5C554A";
const C_COIN = "#E8C547", C_COIN_HI = "#FFF3C4";
const C_SPIKE = "#9A9287";
const C_FLAG_POLE = "#14130F", C_FLAG_CLOTH = "#3F9E77";
const C_TEXT = "#14130F";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/* ============================== LEVEL ============================== */
const COIN = [
  "..XXXX..",
  ".XXXXXX.",
  "XXXXXXXX",
  "XXXXXXXX",
  "XXXXXXXX",
  "XXXXXXXX",
  ".XXXXXX.",
  "..XXXX.."
];
/* Patrolling foe. Same rendering approach as Clawd: a small char array at 3px cells
   with its own palette, flipped by index rather than a canvas transform. Purple reads
   clearly against Clawd's orange, the gold coins and the grey spikes. */
const FOE = [
  "..MMMM..",
  ".MMMMMM.",
  "MMKMMKMM",
  "MMMMMMMM",
  ".MMMMMM.",
  "M.M..M.M"
];
const FOE_PALETTE = { M: "#7C6BB0", K: "#14130F" };
const FOE_SPRITE_W = 8 * CELL, FOE_SPRITE_H = 6 * CELL;   /* 24 x 18 */
const FOE_W = 20, FOE_H = 18;
const FOE_SPRITE_OFF = (FOE_SPRITE_W - FOE_W) / 2;         /* 2 */
const FOE_SPEED = 40;          /* px/s - a third of MAX_RUN, so it telegraphs */
const STOMP_VY = -300;         /* bounce on a kill, weaker than a full jump (-504) */
const STOMP_GRACE = 12;        /* feet must land within the foe's top 12px of 18 */

const SPIKE = [
  "...X........X...",
  "...X........X...",
  "..XXX......XXX..",
  "..XXX......XXX..",
  ".XXXXX....XXXXX.",
  ".XXXXX....XXXXX.",
  "XXXXXXX..XXXXXXX",
  "XXXXXXX..XXXXXXX"
];

const MAP_SRC = [
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  ".........................................................C....C.....................................",
  ".............................................CM.....C...XXX..XXX....................................",
  "............................MCC...........C.XXXXX..XXX................XXXXXXXXX..............CM..F..",
  "...................C........XXXX.......C.XXXXXXXX...........................................XXXXXXXX",
  "......................................XXXXXXXXXXX....................................C..XXX.....XXXX",
  "..S....C..C....XXX.......^^.....^^.XXXXXXXXXXXXXX.......................C...C......^XXX.XXX.....XXXX",
  "XXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXXXXXXXXX.................XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
  "XXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXXXXXXXXX.................XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
];

const ROWS = MAP_SRC.length, COLS = MAP_SRC[0].length;
const LEVEL_W = COLS * TILE, LEVEL_H = ROWS * TILE;

let map = [];
function loadMap() { map = MAP_SRC.map(row => row.split("")); }

function tileAt(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return ".";
  return map[r][c];
}

function findTile(ch) {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (MAP_SRC[r][c] === ch) return { c: c, r: r };
  return null;
}

function countTile(ch) {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (MAP_SRC[r][c] === ch) n++;
  return n;
}

function findTiles(ch) {
  const out = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (MAP_SRC[r][c] === ch) out.push({ c: c, r: r });
  return out;
}

const SPAWN = findTile("S");
const COIN_TOTAL = countTile("C");
const FOE_TOTAL = countTile("M");

/* ============================== INPUT ============================== */
const keys = new Set();

addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "Space", "KeyR"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === "Space") clawd.bufferT = BUFFER;
  if (e.code === "KeyR") reset();
});

addEventListener("keyup", e => {
  keys.delete(e.code);
  if (e.code === "Space" && clawd.vy < 0) clawd.vy *= JUMP_CUT;
});

/* ============================== STATE =============================== */
const clawd = {
  x: 300, y: 200, vx: 0, vy: 0,
  onGround: false, face: 1, coyoteT: 0, bufferT: 0
};
const cam = { x: 0, y: 0 };
const game = { state: "play", coins: 0, kills: 0, t: 0 };
let foes = [];

function respawn() {
  clawd.x = SPAWN.c * TILE + TILE / 2 - BOX_W / 2;
  clawd.y = (SPAWN.r + 1) * TILE - BOX_H;
  clawd.vx = 0;
  clawd.vy = 0;
  clawd.onGround = false;
  clawd.face = 1;
  clawd.coyoteT = 0;
  clawd.bufferT = 0;
  updateCamera();
}

/* Patrol bounds come from the map, not from the spawn data: scan the contiguous solid
   run in the row beneath the spawn tile. Editing a platform's width automatically
   retargets its foe, so bounds can never drift out of sync with the terrain. */
function spawnFoes() {
  foes = findTiles("M").map(function (t) {
    const groundRow = t.r + 1;
    let lo = t.c, hi = t.c;
    while (lo - 1 >= 0 && isSolid(lo - 1, groundRow)) lo--;
    while (hi + 1 < COLS && isSolid(hi + 1, groundRow)) hi++;
    /* FOE_W (20) exceeds TILE (16), so centring on the spawn tile yields a NEGATIVE
       offset. When the spawn tile is the platform's edge tile that puts the foe
       partly over the void on frame 0; clamp it into the patrol range. */
    return {
      x: clamp(t.c * TILE + (TILE - FOE_W) / 2, lo * TILE, (hi + 1) * TILE - FOE_W),
      y: groundRow * TILE - FOE_H,
      minX: lo * TILE,
      maxX: (hi + 1) * TILE - FOE_W,
      dir: 1,
      alive: true
    };
  });
}

function reset() {
  loadMap();
  spawnFoes();
  game.state = "play";
  game.coins = 0;
  game.kills = 0;
  respawn();
}

/* ============================== PHYSICS ============================= */
function isSolid(c, r) {
  if (c < 0 || c >= COLS) return true;
  if (r < 0 || r >= ROWS) return false;
  return map[r][c] === "X";
}

/* An AABB spanning [lo, hi) overlaps tiles floor(lo/TILE) .. ceil(hi/TILE)-1.
   Using floor(hi/TILE) over-reports a tile when hi lands exactly on a boundary
   (false collisions at rest); using floor((hi-1)/TILE) under-reports for
   sub-pixel positions, which let the box settle fractionally inside solid rock. */
function maxTile(hi) { return Math.ceil(hi / TILE) - 1; }

/* top/bot and left/right below are EXCLUSIVE upper edges: y + BOX_H, x + BOX_W. */
function spansSolidV(c, top, bot) {
  for (let r = Math.floor(top / TILE); r <= maxTile(bot); r++)
    if (isSolid(c, r)) return true;
  return false;
}

function spansSolidH(r, left, right) {
  for (let c = Math.floor(left / TILE); c <= maxTile(right); c++)
    if (isSolid(c, r)) return true;
  return false;
}

function moveX(d) {
  if (d === 0) return;
  clawd.x += d;
  const top = clawd.y, bot = clawd.y + BOX_H;
  if (d > 0) {
    const c = maxTile(clawd.x + BOX_W);
    if (spansSolidV(c, top, bot)) { clawd.x = c * TILE - BOX_W; clawd.vx = 0; }
  } else {
    const c = Math.floor(clawd.x / TILE);
    if (spansSolidV(c, top, bot)) { clawd.x = (c + 1) * TILE; clawd.vx = 0; }
  }
}

function moveY(d) {
  clawd.y += d;
  const left = clawd.x, right = clawd.x + BOX_W;
  if (d > 0) {
    const r = maxTile(clawd.y + BOX_H);
    if (spansSolidH(r, left, right)) { clawd.y = r * TILE - BOX_H; clawd.vy = 0; }
  } else if (d < 0) {
    const r = Math.floor(clawd.y / TILE);
    if (spansSolidH(r, left, right)) { clawd.y = (r + 1) * TILE; clawd.vy = 0; }
  }
  /* Grounded is a DIFFERENT question from "am I overlapping rock": it asks whether
     the tile row directly beneath the feet is solid. Deriving it from the downward
     collision instead makes it flicker every other frame, because a box at rest
     never actually overlaps the floor it stands on. */
  clawd.onGround = clawd.vy >= 0 &&
    spansSolidH(Math.floor((clawd.y + BOX_H) / TILE), left, right);
}

/* The apex band covers the tail of the rise AND the start of the fall, so the hang
   is symmetric about the peak rather than an abrupt slow-then-drop. */
function gravityFor(vy) {
  if (vy < -APEX_VY) return GRAVITY_RISE;
  if (vy > APEX_VY) return GRAVITY_FALL;
  return GRAVITY_APEX;
}

function updateCamera() {
  cam.x = clamp(clawd.x + BOX_W / 2 - W / 2, 0, LEVEL_W - W);
  cam.y = clamp(clawd.y + BOX_H / 2 - H / 2, 0, LEVEL_H - H);
}

function step(dt) {
  if (game.state !== "play") return;

  const dir = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
  if (dir !== 0) {
    clawd.vx += dir * ACCEL * dt;
    clawd.face = dir;
  } else if (clawd.vx !== 0) {
    const s = Math.sign(clawd.vx);
    clawd.vx -= s * FRICTION * dt;
    if (Math.sign(clawd.vx) !== s) clawd.vx = 0;
  }
  clawd.vx = clamp(clawd.vx, -MAX_RUN, MAX_RUN);

  clawd.coyoteT = clawd.onGround ? COYOTE : Math.max(0, clawd.coyoteT - dt);
  clawd.bufferT = Math.max(0, clawd.bufferT - dt);

  if (clawd.bufferT > 0 && clawd.coyoteT > 0) {
    clawd.vy = JUMP_VY;
    clawd.bufferT = 0;
    clawd.coyoteT = 0;
    clawd.onGround = false;
  }

  clawd.vy = Math.min(clawd.vy + gravityFor(clawd.vy) * dt, MAX_FALL);

  moveX(clawd.vx * dt);
  moveY(clawd.vy * dt);
  updateFoes(dt);
  checkTriggers();
  if (game.state === "play") checkFoes();
  updateCamera();
}

/* ============================== ENTITIES =========================== */
function die() {
  respawn();
}

function updateFoes(dt) {
  for (const f of foes) {
    if (!f.alive) continue;
    f.x += f.dir * FOE_SPEED * dt;
    if (f.x <= f.minX) { f.x = f.minX; f.dir = 1; }
    else if (f.x >= f.maxX) { f.x = f.maxX; f.dir = -1; }
  }
}

function checkFoes() {
  for (const f of foes) {
    if (!f.alive) continue;
    if (clawd.x + BOX_W <= f.x || clawd.x >= f.x + FOE_W) continue;
    if (clawd.y + BOX_H <= f.y || clawd.y >= f.y + FOE_H) continue;
    /* A stomp needs BOTH a descent and feet in the foe's top band. Testing vy > 0
       alone would let Clawd kill a foe by clipping its head on the way up, and
       testing only the band would let him kill it by walking into its shoulder. */
    if (clawd.vy > 0 && clawd.y + BOX_H - f.y <= STOMP_GRACE) {
      f.alive = false;
      game.kills++;
      clawd.vy = STOMP_VY;
      clawd.onGround = false;
      clawd.coyoteT = 0;      /* no coyote jump off a foe that no longer exists */
    } else {
      die();
      return;
    }
  }
}

function checkTriggers() {
  if (clawd.y > LEVEL_H) { die(); return; }

  const c0 = Math.floor(clawd.x / TILE);
  const c1 = maxTile(clawd.x + BOX_W);
  const r0 = Math.floor(clawd.y / TILE);
  const r1 = maxTile(clawd.y + BOX_H);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const t = tileAt(c, r);
      if (t === "C") {
        map[r][c] = ".";
        game.coins++;
      } else if (t === "^") {
        /* The spike sprite occupies only the lower half of its tile, so the
           hurtbox must too. A whole-tile hurtbox would kill Clawd while he is
           still visibly clearing the tip by several pixels. */
        if (clawd.y + BOX_H > r * TILE + 8) { die(); return; }
      } else if (t === "F") {
        game.state = "clear";
        return;
      }
    }
  }
}

/* ============================== RENDER ============================== */
let skyGrad = null;
function drawSky() {
  if (!skyGrad) {
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, C_SKY_TOP);
    skyGrad.addColorStop(1, C_SKY_BOT);
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawHills() {
  ctx.fillStyle = C_HILL;
  const off = cam.x * 0.35;
  for (let x = 0; x < W; x += 2) {
    const k = x + off;
    const h = 46 + 20 * Math.sin(k * 0.010) + 12 * Math.sin(k * 0.027);
    ctx.fillRect(x, 300 - h, 2, h + 68);
  }
}

function blit(pattern, x, y, scale, color) {
  ctx.fillStyle = color;
  for (let r = 0; r < pattern.length; r++) {
    const row = pattern[r];
    for (let c = 0; c < row.length; c++) {
      if (row[c] === ".") continue;
      ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
    }
  }
}

function drawClawd() {
  const x = Math.round(clawd.x - SPRITE_OFF - cam.x);
  const y = Math.round(clawd.y - cam.y);
  for (let r = 0; r < 8; r++) {
    const row = CLAWD[r];
    for (let c = 0; c < 12; c++) {
      const ch = row[clawd.face === 1 ? c : 11 - c];
      if (ch === ".") continue;
      ctx.fillStyle = PALETTE[ch];
      ctx.fillRect(x + c * CELL, y + r * CELL, CELL, CELL);
    }
  }
}

function drawFlag(x, y) {
  ctx.fillStyle = C_FLAG_POLE;
  ctx.fillRect(x + 3, y - 12, 2, TILE + 12);
  ctx.fillStyle = C_FLAG_CLOTH;
  for (let i = 0; i < 9; i++) ctx.fillRect(x + 5, y - 11 + i, 9 - i, 1);
}

function drawTiles() {
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  const c0 = Math.max(0, Math.floor(cx / TILE));
  const c1 = Math.min(COLS - 1, Math.floor((cx + W) / TILE));
  const r0 = Math.max(0, Math.floor(cy / TILE));
  const r1 = Math.min(ROWS - 1, Math.floor((cy + H) / TILE));
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const t = map[r][c];
      if (t === "." || t === "S" || t === "M") continue;
      const x = c * TILE - cx, y = r * TILE - cy;
      if (t === "X") {
        ctx.fillStyle = C_TERRAIN;
        ctx.fillRect(x, y, TILE, TILE);
        if (!isSolid(c, r - 1)) {
          ctx.fillStyle = C_TERRAIN_CAP;
          ctx.fillRect(x, y, TILE, 4);
        }
      } else if (t === "C") {
        const bob = Math.round(Math.sin(game.t * 3 + c) * 1.5);
        blit(COIN, x + 4, y + 4 + bob, 1, C_COIN);
        ctx.fillStyle = C_COIN_HI;
        ctx.fillRect(x + 6, y + 6 + bob, 2, 2);
      } else if (t === "^") {
        blit(SPIKE, x, y + 8, 1, C_SPIKE);
      } else if (t === "F") {
        drawFlag(x, y);
      }
    }
  }
}

function drawFoes() {
  for (const f of foes) {
    if (!f.alive) continue;
    const x = Math.round(f.x - FOE_SPRITE_OFF - cam.x);
    const y = Math.round(f.y - cam.y);
    for (let r = 0; r < 6; r++) {
      const row = FOE[r];
      for (let c = 0; c < 8; c++) {
        const ch = row[f.dir === 1 ? c : 7 - c];
        if (ch === ".") continue;
        ctx.fillStyle = FOE_PALETTE[ch];
        ctx.fillRect(x + c * CELL, y + r * CELL, CELL, CELL);
      }
    }
  }
}

function drawHud() {
  ctx.fillStyle = C_TEXT;
  ctx.font = "bold 12px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText("COINS " + game.coins + "/" + COIN_TOTAL +
               "   KILLS " + game.kills + "/" + FOE_TOTAL, 8, 8);
}

function drawClear() {
  ctx.fillStyle = "rgba(240,238,230,0.88)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C_TEXT;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.font = "bold 32px monospace";
  ctx.fillText("CLEAR!", W / 2, 120);
  ctx.font = "bold 14px monospace";
  ctx.fillText("COINS " + game.coins + " / " + COIN_TOTAL, W / 2, 172);
  ctx.fillText("KILLS " + game.kills + " / " + FOE_TOTAL, W / 2, 194);
  ctx.fillText("press R to restart", W / 2, 222);
  ctx.textAlign = "left";
}

function render() {
  drawSky();
  drawHills();
  drawTiles();
  drawFoes();
  drawClawd();
  if (game.state === "clear") drawClear();
  else drawHud();
}

/* ============================== GAME =============================== */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += (now - last) / 1000;
  last = now;
  let n = 0;
  while (acc >= STEP && n < MAX_STEPS) {
    game.t += STEP;
    step(STEP);
    acc -= STEP;
    n++;
  }
  if (acc > STEP * MAX_STEPS) acc = 0;
  render();
  requestAnimationFrame(frame);
}

window.__game = {
  game, clawd, cam, keys, COIN_TOTAL, FOE_TOTAL, SPAWN, LEVEL_W, LEVEL_H, ROWS, COLS,
  get map() { return map; },
  get foes() { return foes; }
};
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
